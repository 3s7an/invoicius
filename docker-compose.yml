services:
  vendor-init:
    image: composer:2
    working_dir: /app
    volumes:
      - .:/app
      - app_vendor:/app/vendor
    command: >
      sh -c "
        composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    environment:
      VITE_DEV_SERVER_URL: http://localhost:${VITE_PORT:-5173}
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./public:/var/www/html/public
      - ./vite.config.js:/var/www/html/vite.config.js
      - ./tailwind.config.js:/var/www/html/tailwind.config.js
      - ./postcss.config.js:/var/www/html/postcss.config.js
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      vendor-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:20-bookworm-slim
    working_dir: /var/www/html
    depends_on:
      vendor-init:
        condition: service_completed_successfully
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./resources:/var/www/html/resources
      - ./public:/var/www/html/public
      - ./vite.config.js:/var/www/html/vite.config.js
      - ./tailwind.config.js:/var/www/html/tailwind.config.js
      - ./postcss.config.js:/var/www/html/postcss.config.js
      - ./package.json:/var/www/html/package.json
      - ./package-lock.json:/var/www/html/package-lock.json
      - ./docker/vite-dev.sh:/docker/vite-dev.sh:ro
      - app_vendor:/var/www/html/vendor:ro
      - vite_node_modules:/var/www/html/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh /docker/vite-dev.sh
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: "${TZ:-Europe/Bratislava}"
      TZ: "${TZ:-Europe/Bratislava}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-}"
      N8N_BASIC_AUTH_ACTIVE: "${N8N_BASIC_AUTH_ACTIVE:-true}"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-admin}"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  mysql_data:
  app_storage:
  app_vendor:
  vite_node_modules:
  n8n_data: