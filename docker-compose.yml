services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: Invoicius
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Bratislava}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: invoicer
      DB_USERNAME: invoicer
      DB_PASSWORD: invoicer
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_SEED: "${RUN_SEED:-false}"
      N8N_USER: "${N8N_USER:-n8n-user}"
      N8N_TOKEN: "${N8N_TOKEN:-change-me}"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: invoicer
      MYSQL_USER: invoicer
      MYSQL_PASSWORD: invoicer
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: "${TZ:-Europe/Bratislava}"
      TZ: "${TZ:-Europe/Bratislava}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-}"
      N8N_BASIC_AUTH_ACTIVE: "${N8N_BASIC_AUTH_ACTIVE:-true}"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-admin}"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  mysql_data:
  app_storage:
  n8n_data:
