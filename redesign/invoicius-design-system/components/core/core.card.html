<!-- @dsCard group="Components" viewport="700x420" name="Core · Button, Card, Badge" subtitle="Emerald buttons, surfaces and status pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 24px; }
  .sec { margin-bottom: 22px; }
  .h { font-size: 11px; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Card, Badge } = window.InvoiciusDesignSystem_31395d;
  function Demo() {
    return (
      <div>
        <div className="sec">
          <p className="h">Button — variants</p>
          <div className="row">
            <Button icon="pi-plus">Nová faktúra</Button>
            <Button variant="secondary">Zrušiť</Button>
            <Button variant="ghost" icon="pi-pencil">Upraviť</Button>
            <Button variant="danger" icon="pi-trash">Zmazať</Button>
            <Button variant="text" icon="pi-arrow-right" iconPos="right">Zobraziť všetky</Button>
          </div>
        </div>
        <div className="sec">
          <p className="h">Button — sizes & states</p>
          <div className="row">
            <Button size="sm">Small</Button>
            <Button size="md">Medium</Button>
            <Button size="lg">Large</Button>
            <Button loading>Ukladá sa</Button>
            <Button disabled>Disabled</Button>
          </div>
        </div>
        <div className="sec">
          <p className="h">Badge — invoice status</p>
          <div className="row">
            <Badge status="paid" dot>Uhradené</Badge>
            <Badge status="awaiting" dot>Čaká na úhradu</Badge>
            <Badge status="overdue" dot>Po splatnosti</Badge>
            <Badge status="sent" dot>Odoslané</Badge>
            <Badge status="draft" dot>Koncept</Badge>
            <Badge tone="success">Aktívne</Badge>
          </div>
        </div>
        <div className="sec" style={{marginBottom:0}}>
          <p className="h">Card</p>
          <div style={{maxWidth:340}}>
            <Card title="Posledné faktúry" actions={<Button variant="text" size="sm" icon="pi-arrow-right" iconPos="right">Všetky</Button>}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div><div style={{fontWeight:600,color:'var(--text-strong)',fontSize:14}}>2024-0042</div><div style={{fontSize:13,color:'var(--text-muted)'}}>Aurora s.r.o.</div></div>
                <Badge status="paid">Uhradené</Badge>
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
