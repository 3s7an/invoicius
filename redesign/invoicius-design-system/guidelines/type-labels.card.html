<!-- @dsCard group="Type" viewport="700x150" name="Labels & numerals" subtitle="Uppercase micro-labels and tabular amounts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; display: flex; gap: 40px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .lab { font-size: var(--text-xs); font-weight: 500; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); }
  .val { font-size: var(--text-xl); font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .cap { font-size: 11px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="col">
    <span class="lab">Vytvorené</span>
    <span class="val">2 480,00 €</span>
    <span class="cap">uppercase label · tabular-nums value</span>
  </div>
  <div class="col">
    <span class="lab">Po splatnosti</span>
    <span class="val">  980,50 €</span>
    <span class="cap">amounts align on the decimal</span>
  </div>
</body>
</html>
