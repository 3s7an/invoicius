<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="The product leans almost entirely on shadow-sm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); padding: 26px; display: flex; gap: 26px; align-items: center; }
  .item { text-align: center; }
  .box { width: 110px; height: 60px; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .lbl { margin-top: 10px; font-size: 11px; color: var(--text-muted); }
  .lbl b { display: block; color: var(--text-strong); font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl"><b>shadow-sm</b>cards, buttons — default</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow)"></div><div class="lbl"><b>shadow</b>raised</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl"><b>shadow-md</b>dropdowns</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl"><b>shadow-lg</b>modals</div></div>
</body>
</html>
