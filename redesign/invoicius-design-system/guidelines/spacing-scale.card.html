<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base — gaps, padding, stack rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; }
  .r { display: flex; align-items: center; gap: 14px; padding: 3px 0; }
  .r .m { width: 120px; font-size: 11px; color: var(--text-muted); }
  .r .m b { color: var(--text-strong); font-weight: 600; }
  .bar { height: 16px; background: var(--primary); border-radius: 3px; }
</style>
</head>
<body>
  <div class="r"><span class="m"><b>1</b> · 4px</span><span class="bar" style="width:4px"></span></div>
  <div class="r"><span class="m"><b>2</b> · 8px</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="m"><b>3</b> · 12px</span><span class="bar" style="width:12px"></span></div>
  <div class="r"><span class="m"><b>4</b> · 16px — base</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="m"><b>6</b> · 24px — stack</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="m"><b>8</b> · 32px</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="m"><b>12</b> · 48px</span><span class="bar" style="width:48px"></span></div>
</body>
</html>
