<!-- @dsCard group="Colors" viewport="700x150" name="Brand · Emerald" subtitle="Primary scale — PrimeVue Aura preset, the nav bar color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 76px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; }
  .sw span { font-size: 10px; font-weight: 600; }
  .lbl { font-size: 11px; color: var(--text-muted); margin-top: 8px; display: flex; gap: 6px; align-items: baseline; }
  .lbl b { color: var(--text-strong); font-weight: 600; font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--emerald-50)"><span style="color:#065f46">50</span></div>
    <div class="sw" style="background:var(--emerald-100)"><span style="color:#065f46">100</span></div>
    <div class="sw" style="background:var(--emerald-200)"><span style="color:#065f46">200</span></div>
    <div class="sw" style="background:var(--emerald-300)"><span style="color:#065f46">300</span></div>
    <div class="sw" style="background:var(--emerald-400)"><span style="color:#064e3b">400</span></div>
    <div class="sw" style="background:var(--emerald-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--emerald-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--emerald-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--emerald-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--emerald-900)"><span style="color:#fff">900</span></div>
    <div class="sw" style="background:var(--emerald-950)"><span style="color:#fff">950</span></div>
  </div>
  <div class="lbl"><b>--primary</b> #10b981 (500) · hover 600 · active 700 — primary buttons, nav, links, focus rings</div>
</body>
</html>
