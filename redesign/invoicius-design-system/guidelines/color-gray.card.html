<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals · Gray" subtitle="Tailwind gray — surfaces, borders and text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .sw { flex: 1; height: 76px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; }
  .sw span { font-size: 10px; font-weight: 600; }
  .lbl { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .lbl b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--gray-50)"><span style="color:#374151">50</span></div>
    <div class="sw" style="background:var(--gray-100)"><span style="color:#374151">100</span></div>
    <div class="sw" style="background:var(--gray-200)"><span style="color:#374151">200</span></div>
    <div class="sw" style="background:var(--gray-300)"><span style="color:#374151">300</span></div>
    <div class="sw" style="background:var(--gray-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--gray-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--gray-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--gray-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--gray-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--gray-900)"><span style="color:#fff">900</span></div>
    <div class="sw" style="background:var(--gray-950)"><span style="color:#fff">950</span></div>
  </div>
  <div class="lbl"><b>100</b> app bg · <b>200</b> borders · <b>500</b> muted text · <b>700</b> body · <b>900</b> headings &amp; amounts</div>
</body>
</html>
