<!-- @dsCard group="Colors" viewport="700x130" name="Dashboard KPI accents" subtitle="Soft icon-chip tints for stat tiles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 20px; display: flex; gap: 16px; }
  .chip { display: flex; align-items: center; gap: 10px; }
  .ic { width: 44px; height: 44px; border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
  .t b { display: block; font-size: 12px; color: var(--text-strong); font-weight: 600; }
  .t span { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="chip"><span class="ic" style="background:var(--accent-sky-soft);color:var(--accent-sky)">F</span><span class="t"><b>sky</b><span>Faktúry</span></span></div>
  <div class="chip"><span class="ic" style="background:var(--accent-violet-soft);color:var(--accent-violet)">K</span><span class="t"><b>violet</b><span>Klienti</span></span></div>
  <div class="chip"><span class="ic" style="background:var(--accent-amber-soft);color:var(--accent-amber)">A</span><span class="t"><b>amber</b><span>Automatizácie</span></span></div>
  <div class="chip"><span class="ic" style="background:var(--primary-soft);color:var(--primary-active)">€</span><span class="t"><b>emerald</b><span>Tržby</span></span></div>
</body>
</html>
