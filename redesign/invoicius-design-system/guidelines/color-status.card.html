<!-- @dsCard group="Colors" viewport="700x170" name="Invoice status palette" subtitle="The semantic colors behind every status pill, dot and pie segment" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 2px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 9999px; }
  .meta { font-size: 10px; color: var(--text-muted); }
  .meta b { display: block; color: var(--text-strong); font-size: 11px; font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <span class="pill" style="background:var(--status-paid-soft);color:var(--status-paid-text)"><span class="dot" style="background:var(--status-paid)"></span>Uhradené</span>
      <span class="meta"><b>paid</b>cyan #06b6d4</span>
    </div>
    <div class="item">
      <span class="pill" style="background:var(--status-awaiting-soft);color:var(--status-awaiting-text)"><span class="dot" style="background:var(--status-awaiting)"></span>Čaká na úhradu</span>
      <span class="meta"><b>awaiting</b>amber #f59e0b</span>
    </div>
    <div class="item">
      <span class="pill" style="background:var(--status-overdue-soft);color:var(--status-overdue-text)"><span class="dot" style="background:var(--status-overdue)"></span>Po splatnosti</span>
      <span class="meta"><b>overdue</b>red #ef4444</span>
    </div>
    <div class="item">
      <span class="pill" style="background:var(--status-sent-soft);color:var(--status-sent-text)"><span class="dot" style="background:var(--status-sent)"></span>Odoslané</span>
      <span class="meta"><b>sent</b>sky #0ea5e9</span>
    </div>
    <div class="item">
      <span class="pill" style="background:var(--status-draft-soft);color:var(--status-draft-text)"><span class="dot" style="background:var(--status-draft)"></span>Koncept</span>
      <span class="meta"><b>draft</b>slate #94a3b8</span>
    </div>
  </div>
</body>
</html>
