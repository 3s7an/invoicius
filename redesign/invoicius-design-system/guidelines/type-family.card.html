<!-- @dsCard group="Type" viewport="700x150" name="Typeface · Figtree" subtitle="The single brand typeface, in its weights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; color: var(--text-strong); }
  .big { font-size: 46px; font-weight: 600; letter-spacing: var(--tracking-tight); line-height: 1; }
  .weights { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  .w { font-size: 20px; }
  .w span { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; font-weight: 400; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="big">Invoicius — Figtree</div>
  <div class="weights">
    <div class="w" style="font-weight:400">Faktúra<span>Regular · 400</span></div>
    <div class="w" style="font-weight:500">Faktúra<span>Medium · 500</span></div>
    <div class="w" style="font-weight:600">Faktúra<span>Semibold · 600</span></div>
    <div class="w" style="font-weight:700">Faktúra<span>Bold · 700</span></div>
  </div>
</body>
</html>
