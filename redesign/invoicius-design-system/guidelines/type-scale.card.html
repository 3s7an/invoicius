<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>

  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; }
  .r .m { width: 130px; flex-shrink: 0; font-size: 11px; color: var(--text-muted); }

</style>
</head>
<body>
  <div class="r"><span class="m"><b>3xl</b> · 30 / 600</span><span style="font-size:var(--text-3xl);font-weight:600;letter-spacing:var(--tracking-tight)">Prehľad</span></div>
  <div class="r"><span class="m"><b>2xl</b> · 24 / 600</span><span style="font-size:var(--text-2xl);font-weight:600;letter-spacing:var(--tracking-tight)">Faktúry</span></div>
  <div class="r"><span class="m"><b>xl</b> · 20 / 600</span><span style="font-size:var(--text-xl);font-weight:600">12 480,00 €</span></div>
  <div class="r"><span class="m"><b>lg</b> · 18 / 600</span><span style="font-size:var(--text-lg);font-weight:600">2024-0042</span></div>
  <div class="r"><span class="m"><b>base</b> · 16 / 400</span><span style="font-size:var(--text-base)">Predvolený text</span></div>
  <div class="r"><span class="m"><b>sm</b> · 14 / 400</span><span style="font-size:var(--text-sm);color:var(--text-body)">Telo a bunky tabuľky</span></div>
  <div class="r"><span class="m"><b>xs</b> · 12 / 500</span><span style="font-size:var(--text-xs);color:var(--text-muted)">Popisky a poznámky</span></div>
