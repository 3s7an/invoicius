<!-- @template name="Invoicius app screen" description="Emerald top-nav app shell with a page header and content cards — ready to fill in." -->
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoicius — nová obrazovka</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-app); }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  window.addEventListener('DOMContentLoaded', () => {
    const DS = window.InvoiciusDesignSystem_31395d;
    if (!DS) { document.getElementById('root').innerHTML = '<p style="font-family:sans-serif;padding:24px">Design system bundle not loaded — see ds-base.js.</p>'; return; }
    const { Button, Card, Badge, StatCard } = DS;

    const NAV = [
      { key: 'dashboard', label: 'Prehľad' },
      { key: 'invoices', label: 'Faktúry' },
      { key: 'recipients', label: 'Klienti' },
      { key: 'automatizations', label: 'Automatizácie' },
    ];

    function Shell() {
      const [page, setPage] = React.useState('dashboard');
      return (
        <div style={{ minHeight: '100%', background: 'var(--surface-app)' }}>
          <nav style={{ background: 'var(--surface-nav)' }}>
            <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '0 24px', height: 'var(--nav-height)', display: 'flex', alignItems: 'center', gap: 40 }}>
              <span style={{ color: '#fff', fontSize: 20, fontWeight: 600, letterSpacing: '-0.02em' }}>Invoicius</span>
              <div style={{ display: 'flex', gap: 32 }}>
                {NAV.map((it) => (
                  <button key={it.key} onClick={() => setPage(it.key)} style={{
                    background: 'none', border: 'none', cursor: 'pointer', height: 'var(--nav-height)',
                    fontFamily: 'var(--font-sans)', fontSize: 16, fontWeight: 600,
                    color: page === it.key ? '#fff' : 'rgba(255,255,255,.85)',
                    borderBottom: `2px solid ${page === it.key ? '#fff' : 'transparent'}`,
                  }}>{it.label}</button>
                ))}
              </div>
            </div>
          </nav>

          <main style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '32px 24px' }}>
            {/* Page header */}
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 24 }}>
              <h1 style={{ margin: 0, fontSize: 'var(--text-3xl)', fontWeight: 600, letterSpacing: '-0.02em', color: 'var(--text-strong)' }}>Prehľad</h1>
              <Button icon="pi-plus">Nová faktúra</Button>
            </div>

            {/* ↓↓↓ Replace this block with your screen ↓↓↓ */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
              <StatCard label="Faktúry" value="128" hint="celkom v systéme" icon="pi-file" accent="sky" />
              <StatCard label="Klienti" value="34" hint="celkom v systéme" icon="pi-users" accent="violet" />
              <StatCard label="Automatizácie" value="3" hint="aktívne" icon="pi-bolt" accent="amber" />
            </div>
            <Card title="Posledné faktúry">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontWeight: 600, color: 'var(--text-strong)' }}>2026-0042</div>
                  <div style={{ fontSize: 14, color: 'var(--text-muted)' }}>Aurora s.r.o.</div>
                </div>
                <Badge status="paid">Uhradené</Badge>
              </div>
            </Card>
            {/* ↑↑↑ Replace this block with your screen ↑↑↑ */}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Shell />);
  });
</script>
</body>
</html>
