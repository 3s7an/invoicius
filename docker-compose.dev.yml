# Development overlay: live Vue/CSS via Vite (HMR), dev Composer deps (PHPUnit, PHPStan).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or: npm run docker:dev

services:
  vendor-init:
    image: composer:2
    working_dir: /app
    volumes:
      - .:/app
      - app_vendor:/app/vendor
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist --optimize-autoloader
      "
    restart: "no"

  app:
    depends_on:
      vendor-init:
        condition: service_completed_successfully
    environment:
      VITE_DEV_SERVER_URL: http://localhost:${VITE_PORT:-5173}
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./public:/var/www/html/public
      - ./tests:/var/www/html/tests
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./vite.config.js:/var/www/html/vite.config.js
      - ./tailwind.config.js:/var/www/html/tailwind.config.js
      - ./postcss.config.js:/var/www/html/postcss.config.js
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage/app

  vite:
    image: node:20-bookworm-slim
    working_dir: /var/www/html
    depends_on:
      vendor-init:
        condition: service_completed_successfully
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./resources:/var/www/html/resources
      - ./public:/var/www/html/public
      - ./vite.config.js:/var/www/html/vite.config.js
      - ./tailwind.config.js:/var/www/html/tailwind.config.js
      - ./postcss.config.js:/var/www/html/postcss.config.js
      - ./package.json:/var/www/html/package.json
      - ./package-lock.json:/var/www/html/package-lock.json
      - ./docker/vite-dev.sh:/docker/vite-dev.sh:ro
      - app_vendor:/var/www/html/vendor:ro
      - vite_node_modules:/var/www/html/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh /docker/vite-dev.sh
    restart: unless-stopped

volumes:
  app_vendor:
  vite_node_modules:
